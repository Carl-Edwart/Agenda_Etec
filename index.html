<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ── SPLASH SCREEN ── -->
<div id="splash">
  <div id="splash-inner">
    <div id="splash-logo">
      <div id="splash-icon">⌂</div>
      <div id="splash-name">AGENDA<span>PESSOAL</span></div>
    </div>
    <div id="splash-bar-wrap"><div id="splash-bar"></div></div>
    <div id="splash-status-row">
      <div id="splash-status">inicializando...</div>
      <div id="splash-pct">0%</div>
    </div>
  </div>
</div>

<style>
#splash {
  position: fixed; inset: 0; z-index: 9999;
  background: #0a0a0f;
  display: flex; align-items: center; justify-content: center;
  -webkit-app-region: drag;
  overflow: hidden;
  transition: opacity 0.7s ease;
}
#splash::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 40%, rgba(26,143,255,0.09), transparent 62%);
  pointer-events: none;
}
#splash.hide { opacity: 0; pointer-events: none; }

#splash-inner {
  display: flex; flex-direction: column; align-items: center; gap: 20px;
  width: 280px;
}

#splash-logo {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}

#splash-icon {
  position: relative;
  font-size: 38px;
  color: #1a8fff;
  text-shadow: 0 0 18px rgba(26,143,255,0.55);
  animation: splashPulse 2.4s ease-in-out infinite;
}
#splash-icon::after {
  content: '';
  position: absolute; inset: -14px;
  border: 1px dashed rgba(26,143,255,0.30);
  border-radius: 50%;
  animation: splashRing 9s linear infinite;
}
@keyframes splashRing { to { transform: rotate(360deg); } }
@keyframes splashPulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.6; transform: scale(0.92); }
}

#splash-name {
  font-family: 'Courier New', monospace;
  font-size: 18px; font-weight: 500;
  letter-spacing: 0.35em;
  color: #e8edf5;
  text-transform: uppercase;
}
#splash-name span {
  color: #1a8fff;
  margin-left: 2px;
}

#splash-bar-wrap {
  width: 100%;
  height: 2px;
  background: #1e2a3a;
  border-radius: 2px;
  overflow: hidden;
}
#splash-bar {
  position: relative;
  overflow: hidden;
  height: 100%;
  width: 0%;
  background: #1a8fff;
  border-radius: 2px;
  transition: width 0.55s ease;
  box-shadow: 0 0 8px #1a8fff88;
}
#splash-bar::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  transform: translateX(-100%);
  animation: splashShimmer 1.5s ease-in-out infinite;
}
@keyframes splashShimmer { to { transform: translateX(100%); } }

#splash.done #splash-bar {
  box-shadow: 0 0 16px #1a8fff, 0 0 4px #fff;
  animation: splashBarDone 0.9s ease;
}
@keyframes splashBarDone {
  0%   { filter: brightness(1); }
  40%  { filter: brightness(1.9); }
  100% { filter: brightness(1); }
}

#splash-status-row {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

#splash-status {
  font-family: 'Courier New', monospace;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #3a4050;
  min-height: 14px;
  transition: color 0.2s;
}
#splash.done #splash-status { color: #28c840; }

#splash-pct {
  font-family: 'Courier New', monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  color: #1a8fff;
  opacity: 0.75;
}
</style>

<div id="app">

  <!-- TITLEBAR -->
  <div id="titlebar">
    <div class="titlebar-title">AGENDA PESSOAL <span class="cursor"></span></div>
    <div class="titlebar-right" style="-webkit-app-region:no-drag;display:flex;align-items:center;gap:10px;">

      <!-- SLIDER DE BRILHO -->
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="font-size:10px;color:var(--gray);opacity:0.6;">☼</span>
        <input id="slider-brilho" type="range" min="40" max="120" value="100" step="2"
          title="brilho da tela"
          style="width:72px;height:3px;cursor:pointer;accent-color:var(--blue);opacity:0.7;"
          oninput="ajustarBrilho(this.value)" />
        <span style="font-size:10px;color:var(--gray);opacity:0.9;">☀</span>
      </div>

      <!-- BOTÃO TEMA -->
      <button id="btn-theme-toggle" onclick="toggleTheme()" title="alternar tema" style="
        background:transparent;border:0.5px solid var(--border);border-radius:5px;
        color:var(--gray);cursor:pointer;font-size:13px;
        padding:3px 8px;transition:all 0.15s;line-height:1;
      " onmouseenter="this.style.color='var(--blue)';this.style.borderColor='var(--blue-dim)'"
         onmouseleave="this.style.color='var(--gray)';this.style.borderColor='var(--border)'">◑</button>

      <!-- CONTROLES DA JANELA — minimizar · maximizar · fechar -->
      <div class="titlebar-dots">
        <div class="dot dot-green" onclick="window.api.minimize()" title="minimizar">
          <svg viewBox="0 0 10 10" width="8" height="8" aria-hidden="true"><path d="M2 5h6" stroke="#0a0a0f" stroke-opacity=".72" stroke-width="1.3" stroke-linecap="round"/></svg>
        </div>
        <div class="dot dot-yellow" onclick="window.api.maximize()" title="maximizar">
          <svg viewBox="0 0 10 10" width="8" height="8" aria-hidden="true"><rect x="2.2" y="2.2" width="5.6" height="5.6" rx="0.8" fill="none" stroke="#0a0a0f" stroke-opacity=".72" stroke-width="1.2"/></svg>
        </div>
        <div class="dot dot-red" onclick="window.api.close()" title="fechar">
          <svg viewBox="0 0 10 10" width="8" height="8" aria-hidden="true"><path d="M2.4 2.4l5.2 5.2M7.6 2.4L2.4 7.6" stroke="#0a0a0f" stroke-opacity=".72" stroke-width="1.3" stroke-linecap="round"/></svg>
        </div>
      </div>

    </div>
  </div>

  <!-- BODY -->
  <div id="body">

    <!-- SIDEBAR -->
    <nav id="sidebar">
      <button class="sb-btn active" data-page="home" onclick="navigate('home')">
        ⌂
        <span class="sb-tooltip">home</span>
      </button>
      <button class="sb-btn" data-page="tarefas" onclick="navigate('tarefas')">
        ✓
        <span class="sb-tooltip">tarefas</span>
      </button>
      <button class="sb-btn" data-page="calendario" onclick="navigate('calendario')">
        ◫
        <span class="sb-tooltip">calendário</span>
      </button>
      <button class="sb-btn" data-page="professores" onclick="navigate('professores')">
        ♟
        <span class="sb-tooltip">professores</span>
      </button>
      <button class="sb-btn" data-page="estudos" onclick="navigate('estudos')">
        ✎
        <span class="sb-tooltip">estudos</span>
      </button>
      <button class="sb-btn" data-page="horario" onclick="navigate('horario')">
        ▦
        <span class="sb-tooltip">horário</span>
      </button>
      <div class="sb-spacer"></div>
      <button class="sb-btn" data-page="config" onclick="navigate('config')">
        ⚙
        <span class="sb-tooltip">config</span>
      </button>
    </nav>

    <!-- CONTENT -->
    <div id="content">
      <div id="page-home"       class="page active"></div>
      <div id="page-tarefas"    class="page"></div>
      <div id="page-calendario" class="page"></div>
      <div id="page-professores"class="page"></div>
      <div id="page-estudos"    class="page"></div>
      <div id="page-horario"    class="page"></div>
      <div id="page-config"     class="page"></div>
    </div>

  </div>
</div>

<!-- SCRIPTS -->
<script src="renderer/store.js"></script>
<script src="renderer/home.js"></script>
<script src="renderer/tarefas.js"></script>
<script src="renderer/calendario.js"></script>
<script src="renderer/professores.js"></script>
<script src="renderer/estudos.js"></script>
<script src="renderer/horario.js"></script>
<script src="renderer/config.js"></script>
<script src="renderer/app.js"></script>

<script>
/* ── SPLASH CONTROLLER ── */
const _splashSteps = [
  { pct: 8,   msg: 'iniciando núcleo...'      },
  { pct: 16,  msg: 'carregando módulos...'    },
  { pct: 24,  msg: 'verificando horários...'  },
  { pct: 32,  msg: 'lendo dados locais...'    },
  { pct: 40,  msg: 'montando interface...'    },
  { pct: 48,  msg: 'indexando matérias...'    },
  { pct: 56,  msg: 'calculando prioridades...'},
  { pct: 64,  msg: 'aplicando tema...'        },
  { pct: 72,  msg: 'sincronizando estado...'  },
  { pct: 80,  msg: 'preparando páginas...'    },
  { pct: 88,  msg: 'aquecendo sessão...'      },
  { pct: 94,  msg: 'quase lá...'              },
  { pct: 100, msg: 'pronto.'                  },
]
let _splashIdx = 0
let _splashAppReady = false
let _splashFinished = false
let _splashTimer = null

function splashTick() {
  if (_splashIdx >= _splashSteps.length) return
  const s = _splashSteps[_splashIdx++]
  document.getElementById('splash-bar').style.width = s.pct + '%'
  document.getElementById('splash-pct').textContent  = s.pct + '%'

  const st = document.getElementById('splash-status')
  st.textContent = s.msg
  if (typeof st.animate === 'function')
    st.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: 'ease-out' })
}

function finishSplash() {
  if (_splashFinished) return
  _splashFinished = true
  clearInterval(_splashTimer)

  const splash = document.getElementById('splash')
  if (!splash) return

  splash.classList.add('done')
  const bar    = document.getElementById('splash-bar')
  const status = document.getElementById('splash-status')
  const pct    = document.getElementById('splash-pct')
  if (bar)    bar.style.width       = '100%'
  if (status) status.textContent    = 'pronto.'
  if (pct)    pct.textContent       = '100%'

  // deixa o "pronto." brilhar antes do crossfade
  setTimeout(() => {
    splash.classList.add('hide')
    // crossfade: app entra enquanto o splash sai
    const app = document.getElementById('app')
    if (app) app.classList.add('in')
    setTimeout(() => splash.remove(), 700)
  }, 500)
}

// avança a barra durante o boot (13 passos × 600ms ≈ 7,8s)
_splashTimer = setInterval(() => {
  splashTick()
  if (_splashIdx >= _splashSteps.length) {
    clearInterval(_splashTimer)
    if (_splashAppReady) finishSplash()
  }
}, 600)

// app.js chama assim que o boot termina. A saída NÃO corta
// a sequência: só acontece depois que todos os passos rodarem.
window._splashDone = function () {
  _splashAppReady = true
  if (_splashIdx >= _splashSteps.length) finishSplash()
}
</script>

</body>
</html>
